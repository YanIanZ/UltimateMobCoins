BetonQuest:
  enabled: true
EcoMobs:
  enabled: true
HeadDatabase:
  enabled: true
# Added placeholders to MiniPlaceholders v3
# MiniPlaceholders v2 is not supported!
MiniPlaceholders:
  # This is 'false' by default because v3 of MiniPlaceholders is only compatible with 1.21+
  enabled: false
MythicMobs:
  enabled: true
PlaceholderAPI:
  enabled: true
RoseStacker:
  enabled: true
Vault:
  enabled: true
  # Enabling this means that UltimateMobCoins will register into Vault as an economy plugin
  provide-economy: false
WorldGuard:
  enabled: true

config-version: 3